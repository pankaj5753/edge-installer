services:
  edge-db:
    image: snn-edge-db:${DB_IMAGE_TAG}
    container_name: edge-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${EDGE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${EDGE_DB_NAME}
      MYSQL_USER: ${EDGE_DB_USER}
      MYSQL_PASSWORD: ${EDGE_DB_PASSWORD}
    volumes:
      - edge-db-data:/var/lib/mysql
    networks:
      - edge-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${EDGE_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  edge-api:
    image: snn-edge-api:${API_IMAGE_TAG}
    container_name: edge-api
    restart: unless-stopped
    environment:
      # application.yml binds datasource.* to these custom names (DB_URL/
      # DB_USERNAME/DB_PASSWORD), not Spring's standard SPRING_DATASOURCE_*
      # - and its entrypoint preserves these across sourcing .env.qa so the
      # local edge-db is used instead of .env.qa's QA cloud database.
      DB_URL: jdbc:mysql://edge-db:3306/${EDGE_DB_NAME}
      DB_USERNAME: ${EDGE_DB_USER}
      DB_PASSWORD: ${EDGE_DB_PASSWORD}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./certs/keystore.p12:/etc/edge-api/keystore.p12:ro
      - edge-logs:/var/log/edge-snn
    depends_on:
      edge-db:
        condition: service_healthy
    networks:
      - edge-net
    healthcheck:
      # edge-api serves HTTPS on 443 via the mounted keystore (application.yml
      # server.ssl.*); hits its own /api/health, not generic actuator (EDG-16 AC7).
      test: ["CMD-SHELL", "curl -fk -s https://localhost:443/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  edge-ui:
    image: snn-edge-ui:${UI_IMAGE_TAG}
    container_name: edge-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "${BIND_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - edge-logs:/var/log/edge-snn
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    depends_on:
      edge-api:
        condition: service_healthy
    networks:
      - edge-net
    healthcheck:
      # Process-level check (EDG-16 AC7: "Nginx checks its own process").
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  edge-net:
    driver: bridge

volumes:
  edge-db-data:
    name: edge-db-data
  edge-logs:
    name: edge-logs
