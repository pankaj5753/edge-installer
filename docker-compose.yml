services:
  hub-db:
    image: snn-hub-db:${DB_IMAGE_TAG}
    container_name: hub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${HUB_DB_NAME}
      MYSQL_USER: ${HUB_DB_USER}
      # Passwords read from Docker-secret files (mysql's entrypoint natively
      # supports the _FILE suffix) instead of plaintext env vars - see
      # install.sh's "Database secrets" step and the top-level secrets: block.
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - hub-db-data:/var/lib/mysql
    networks:
      - hub-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$(cat /run/secrets/db_root_password)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  hub-api:
    image: snn-hub-api:${API_IMAGE_TAG}
    container_name: hub-api
    restart: unless-stopped
    env_file:
      # .env.prod is created from .env.prod.example on first run and contains
      # all application configuration (JWT, Okta, proxy URLs, etc).
      # DB_URL/DB_USERNAME in `environment:` below override the .env.prod
      # values to ensure local hub-db is used instead of cloud DB. DB_PASSWORD
      # and the facility-credentials encryption key are NOT set here - they
      # come from Docker secrets below instead (see application.yml's
      # spring.config.import: configtree binding).
      - .env.prod
    environment:
      # application.yml binds datasource.* to these custom names (DB_URL/
      # DB_USERNAME/DB_PASSWORD), not Spring's standard SPRING_DATASOURCE_*
      # - and its entrypoint preserves these across sourcing .env.qa so the
      # local hub-db is used instead of .env.qa's QA cloud database.
      DB_URL: jdbc:mysql://hub-db:3306/${HUB_DB_NAME}
      DB_USERNAME: ${HUB_DB_USER}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    secrets:
      - encryption_key
      - db_password
    volumes:
      - ./certs/keystore.p12:/etc/hub-api/keystore.p12:ro
      - hub-logs:/var/log/hub-api
    depends_on:
      hub-db:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      # hub-api serves HTTPS on 443 via the mounted keystore (application.yml
      # server.ssl.*); hits its own /api/health, not generic actuator.
      test: ["CMD-SHELL", "curl -fk -s https://localhost:443/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  hub-ui:
    image: snn-hub-ui:${UI_IMAGE_TAG}
    container_name: hub-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "${BIND_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - hub-logs:/var/log/hub-ui
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    depends_on:
      hub-api:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      # Process-level check: Nginx checks its own process.
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  hub-net:
    driver: bridge

volumes:
  hub-db-data:
    name: hub-db-data
  hub-logs:
    name: hub-logs

secrets:
  # File-based secrets generated by install.sh under ./secrets/ (mode 400,
  # owned by the container's UID:GID) - never stored in .env/.env.prod.
  encryption_key:
    file: ./secrets/encryption_key
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password
