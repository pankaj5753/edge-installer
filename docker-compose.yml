services:
  hub-db:
    image: snn-hub-db:${DB_IMAGE_TAG}
    container_name: hub-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${HUB_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${HUB_DB_NAME}
      MYSQL_USER: ${HUB_DB_USER}
      MYSQL_PASSWORD: ${HUB_DB_PASSWORD}
    volumes:
      - hub-db-data:/var/lib/mysql
    networks:
      - hub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${HUB_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  hub-api:
    image: snn-hub-api:${API_IMAGE_TAG}
    container_name: hub-api
    restart: unless-stopped
    env_file:
      # .env.prod is created from .env.prod.example on first run and contains
      # all application configuration (JWT, Okta, proxy URLs, etc).
      # DB_URL/DB_USERNAME/DB_PASSWORD in `environment:` below override the
      # .env.prod values to ensure local hub-db is used instead of cloud DB.
      - .env.prod
    environment:
      # application.yml binds datasource.* to these custom names (DB_URL/
      # DB_USERNAME/DB_PASSWORD), not Spring's standard SPRING_DATASOURCE_*
      # - and its entrypoint preserves these across sourcing .env.qa so the
      # local hub-db is used instead of .env.qa's QA cloud database.
      DB_URL: jdbc:mysql://hub-db:3306/${HUB_DB_NAME}
      DB_USERNAME: ${HUB_DB_USER}
      DB_PASSWORD: ${HUB_DB_PASSWORD}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./certs/keystore.p12:/etc/hub-api/keystore.p12:ro
      - hub-logs:/var/log/hub-snn
    depends_on:
      hub-db:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      # hub-api serves HTTPS on 443 via the mounted keystore (application.yml
      # server.ssl.*); hits its own /api/health, not generic actuator.
      test: ["CMD-SHELL", "curl -fk -s https://localhost:443/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  hub-ui:
    image: snn-hub-ui:${UI_IMAGE_TAG}
    container_name: hub-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "${BIND_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - hub-logs:/var/log/hub-snn
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    depends_on:
      hub-api:
        condition: service_healthy
    networks:
      - hub-net
    healthcheck:
      # Process-level check: Nginx checks its own process.
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  hub-net:
    driver: bridge

volumes:
  hub-db-data:
    name: hub-db-data
  hub-logs:
    name: hub-logs
